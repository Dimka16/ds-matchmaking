services:
  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mmdb}
      POSTGRES_USER: ${POSTGRES_USER:-mmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmpass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmuser} -d ${POSTGRES_DB:-mmdb} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # -------------------------
  # Redis (Socket.IO message broker)
  # -------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # -------------------------
  # Kafka (Apache official image) in KRaft mode
  # -------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "${KAFKA_NODE_ID:-1}@kafka:${KAFKA_CONTROLLER_PORT:-9093}"

      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT:-9092},EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT:-9094},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-9093}"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:${KAFKA_INTERNAL_PORT:-9092},EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:${KAFKA_INTERNAL_PORT:-9092} >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # -------------------------
  # Kafka UI
  # -------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:${KAFKA_INTERNAL_PORT:-9092}"

  # -------------------------
  # Kafka init (topics)
  # -------------------------
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-lc" ]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic match.classic --partitions ${KAFKA_TOPIC_PARTITIONS:-3} --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic match.solo --partitions ${KAFKA_TOPIC_PARTITIONS:-3} --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic match.duo --partitions ${KAFKA_TOPIC_PARTITIONS:-3} --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic match.blitz --partitions ${KAFKA_TOPIC_PARTITIONS:-3} --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic match.tournament --partitions ${KAFKA_TOPIC_PARTITIONS:-3} --replication-factor 1"
    restart: "no"

  # -------------------------
  # Nginx reverse proxy / load balancer
  # Single public endpoint for ALL api replicas
  # -------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  # -------------------------
  # Flask API (NO container_name -> allows scaling)
  # Remove host port publish to avoid collisions
  # Access it via nginx: http://localhost:8088
  # -------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------
  # Workers (keep container_name since you typically won't scale these)
  # -------------------------
  worker-classic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker-classic
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_MODE: classic
    depends_on:
      kafka:
        condition: service_healthy
      nginx:
        condition: service_started
    command: [ "python", "-m", "app.workers.run_worker" ]

  worker-solo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker-solo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_MODE: solo
    depends_on:
      kafka:
        condition: service_healthy
      nginx:
        condition: service_started
    command: [ "python", "-m", "app.workers.run_worker" ]

  worker-duo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker-duo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_MODE: duo
    depends_on:
      kafka:
        condition: service_healthy
      nginx:
        condition: service_started
    command: [ "python", "-m", "app.workers.run_worker" ]

  worker-tournament:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker-tournament
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_MODE: tournament
    depends_on:
      kafka:
        condition: service_healthy
      nginx:
        condition: service_started
    command: [ "python", "-m", "app.workers.run_worker" ]

  worker-blitz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker-blitz
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKER_MODE: blitz
    depends_on:
      kafka:
        condition: service_healthy
      nginx:
        condition: service_started
    command: [ "python", "-m", "app.workers.run_worker" ]

volumes:
  postgres_data:
  kafka_data: